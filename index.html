<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="吃什麼">
  <title>今天吃什麼</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div id="page-sub" class="page-sub"></div>
      <h1 id="page-title">今天吃什麼？</h1>
    </div>
  </header>

  <main>
    <!-- 幫我選 -->
    <section id="tab-pick" class="tab active">
      <div class="panel hero">
        <div class="field-label">從哪裡選</div>
        <div class="seg" id="pick-source">
          <button data-v="nearby" class="on">附近的店</button>
          <button data-v="category">料理類型</button>
          <button data-v="place">口袋名單</button>
        </div>

        <div class="field-label budget-label">每人預算 <b id="budget-value"></b></div>
        <input type="range" id="budget" min="100" max="1000" step="50" aria-label="每人預算">
        <div class="range-ticks"><span>$100</span><span>$500</span><span>不限</span></div>

        <label class="row-check">
          避開最近
          <select id="avoid-days">
            <option value="0">0</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
          </select>
          天吃過的
        </label>
        <label class="row-check hidden" id="only-want-row"><input type="checkbox" id="only-want"> 只抽還沒吃過的店</label>
      </div>

      <button class="big-btn pick-btn" id="pick-btn"><span class="dice" aria-hidden="true">🎲</span><span>幫我選</span></button>

      <div id="pick-results" class="cards"></div>
      <div id="pick-actions" class="row-actions hidden">
        <button class="ghost" id="reroll-btn">🔄 換一批</button>
        <button class="ghost" id="share-btn">📤 問朋友</button>
      </div>
    </section>

    <!-- 附近 -->
    <section id="tab-nearby" class="tab">
      <div class="nb-search">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="nearby-filter" type="search" placeholder="搜尋店名或料理…" autocomplete="off">
        </label>
        <button class="icon-btn" id="locate-btn" aria-label="重新定位"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
      </div>
      <div class="chip-bar" id="nb-chips">
        <span class="chip chip-select"><select id="nb-radius" aria-label="範圍">
          <option value="400">400m 內</option>
          <option value="800">800m 內</option>
          <option value="1500">1.5km 內</option>
          <option value="3000">3km 內</option>
        </select></span>
        <span class="chip chip-select"><select id="nb-sort" aria-label="排序">
          <option value="distance">離我最近</option>
          <option value="rating">評分最高</option>
          <option value="random">隨機排序</option>
        </select></span>
        <span class="chip chip-select"><select id="nb-price" aria-label="價位">
          <option value="0">價位不限</option>
          <option value="1">$ 平價</option>
          <option value="2">$$ 以內</option>
        </select></span>
        <button class="chip" data-toggle="fresh">沒去過</button>
        <button class="chip" data-toggle="open">營業中</button>
        <button class="chip" data-toggle="rating">★ 4 以上</button>
      </div>
      <div class="chip-bar" id="nb-cats"></div>
      <a id="nb-gmaps" class="small hidden" target="_blank" rel="noopener"></a>
      <div class="nb-head">
        <span id="nearby-status" class="muted small"></span>
        <button class="chip hidden" id="nearby-all-btn">📋 全部</button>
        <button class="chip accent hidden" id="nearby-random-btn">🎲 抽 3 家</button>
      </div>
      <div id="nearby-list" class="cards"></div>
    </section>

    <!-- 口袋名單 -->
    <section id="tab-list" class="tab">
      <div class="seg" id="list-mode">
        <button data-v="place" class="on">我的餐廳</button>
        <button data-v="category">料理類型</button>
      </div>
      <button class="big-btn secondary" id="add-btn">＋ 新增</button>
      <div class="row-actions" id="import-row">
        <button class="ghost" id="import-gmaps-btn">📥 從 Google 地圖</button>
        <button class="ghost" id="import-photos-btn">📷 從照片</button>
      </div>
      <div id="list-items" class="list"></div>
    </section>

    <!-- 紀錄 -->
    <section id="tab-log" class="tab">
      <div id="log-items" class="list"></div>
      <div class="section-title">設定</div>
      <div class="panel">
        <div class="field-label">評價摘要設定（選填）</div>
        <p class="muted small">填入 Google Maps API key 後，「附近」的店會顯示 Google 評分、價位與評論。再填 Gemini API key，會用 AI 幫你整理好評 / 負評重點。金鑰只存在這支手機上。</p>
        <label class="small muted">Google Maps API key
          <input type="password" id="key-google" autocomplete="off" spellcheck="false" placeholder="AIza…">
        </label>
        <label class="small muted">Gemini API key（Google AI Studio）
          <input type="password" id="key-gemini" autocomplete="off" spellcheck="false" placeholder="AIza…">
        </label>
        <div class="row-actions"><button class="primary" id="save-keys-btn">儲存設定</button></div>
      </div>
      <div class="panel">
        <div class="field-label">資料備份</div>
        <p class="muted small">資料只存在這支手機的瀏覽器裡，建議偶爾匯出備份。</p>
        <div class="row-actions">
          <button class="ghost" id="export-btn">匯出</button>
          <button class="ghost" id="import-btn">匯入</button>
          <input type="file" id="import-file" accept="application/json" hidden>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-tab="pick" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" class="fill"/><circle cx="15.5" cy="15.5" r="1.2" class="fill"/><circle cx="12" cy="12" r="1.2" class="fill"/></svg>幫我選</button>
    <button data-tab="nearby"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.4"/></svg>附近</button>
    <button data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4-6.5 4v-16a1 1 0 0 1 1-1Z"/></svg>口袋名單</button>
    <button data-tab="log"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>紀錄</button>
  </nav>

  <!-- 新增 / 編輯對話框 -->
  <dialog id="edit-dialog">
    <form method="dialog" id="edit-form">
      <h2 id="edit-title">新增</h2>
      <label>名稱<input name="name" required maxlength="40"></label>
      <label id="emoji-row">圖示<input name="emoji" maxlength="4" placeholder="🍽️"></label>
      <label id="status-row">狀態
        <select name="status">
          <option value="want">想吃（還沒吃過）</option>
          <option value="been">吃過</option>
        </select>
      </label>
      <label id="cat-row">類型<select name="categoryId"></select></label>
      <label>價位
        <select name="price">
          <option value="1">$（約 150 以下）</option>
          <option value="2">$$（約 150–350）</option>
          <option value="3">$$$（約 350 以上）</option>
        </select>
      </label>
      <label id="note-row">備註<input name="note" maxlength="80" placeholder="例如：公司附近、週一公休"></label>
      <div class="row-actions">
        <button type="button" class="ghost danger hidden" id="delete-btn">刪除</button>
        <span class="spacer"></span>
        <button value="cancel" formnovalidate class="ghost">取消</button>
        <button value="ok" class="primary">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 匯入對話框 -->
  <dialog id="import-dialog" class="tall">
    <h2 id="import-title">匯入</h2>
    <div id="import-help" class="small"></div>
    <input type="file" id="import-input" multiple hidden>
    <button class="big-btn secondary" id="import-pick-btn">選擇檔案</button>
    <p id="import-status" class="muted small center"></p>
    <div id="import-select-all" class="row-check hidden"><label><input type="checkbox" id="import-all"> 全選</label><span class="spacer"></span><span id="import-count" class="muted small"></span></div>
    <label id="import-log-row" class="row-check hidden"><input type="checkbox" id="import-add-log" checked> 同時用拍照時間加入飲食紀錄</label>
    <div id="import-rows" class="import-rows"></div>
    <div class="row-actions">
      <button class="ghost" id="import-cancel-btn">取消</button>
      <button class="primary" id="import-ok-btn" disabled>匯入</button>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="reviews.js"></script>
  <script src="import.js"></script>
</body>
</html>
